name: Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Private Repo Run ID containing the artifact'
        required: true
        type: string
      sha:
        description: 'Git SHA from private build'
        required: false
        type: string


permissions:
  packages: write
  contents: read

jobs:
  releaseSnapshot:
    name: Release Snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v7

      - name: Download Distribution
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_READ_ARTIFACTS_PAT }}
        run: |
          gh run download ${{ github.event.client_payload.run_id }} \
            -R zalphion/FeatureControl-Private \
            -n dist \
            -D ./

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
              JAR_FILE=obfuscated.jar
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/zalphion/feature-control:snapshot
